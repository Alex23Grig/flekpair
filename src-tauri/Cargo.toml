[package]
name = "flekpair"
version = "1.0.2"
description = "One-click pairing file exporter for iPhone and iPad"
authors = ["FlekPair contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flekpair_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
idevice = { version = "0.1.68", features = ["usbmuxd", "tcp", "mdns", "heartbeat", "remote_pairing", "pair"] }
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["time", "macros", "net", "rt", "sync"] }
socket2 = "0.6.5"
if-addrs = "0.15.0"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
plist = "1.8.0"
plist-macro = "0.1.6"
thiserror = "2.0.18"
uuid = { version = "1", features = ["v4"] }

# Fetching Apple's device driver, which only Windows lacks. The tests cover it on any platform.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "system-proxy"] }
cab = "0.6.0"

# Apple's symbols, which only macOS can draw. Tauri builds on the same crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSFontDescriptor", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }

[dev-dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "system-proxy"] }
cab = "0.6.0"

[profile.release]
strip = true
